  header {

  .toolbar {

  .order-items { font-size:12.5px; line-height:1.55; margin:6px 0; }

  .order-items .item .qty { color:#f1c40f; font-weight:700; flex-shrink:0; }

  .kelola-item .info .harga {

    width:50px; height:28px;

  .toggle-switch input { display:none; }
  .toggle-switch label {
    position:absolute; inset:0;
    background:#444; border-radius:14px; cursor:pointer;
    transition:.2s;
  }
  .toggle-switch label::after {
    content:''; position:absolute;
    width:22px; height:22px; background:#fff;
    border-radius:50%; top:3px; left:3px;
    transition:.2s;
  }
  .toggle-switch input:checked + label {
    background:#27ae60;
  }
  .toggle-switch input:checked + label::after {
    left:25px;
  }
  .toggle-switch label.busy {
    opacity:.5; pointer-events:none;
  }

    position:sticky; bottom:0;
    background:#0f0f0f;
    padding:10px 0;
    margin-top:12px;

</div>

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let orders = [];
let calls = [];
let filterMode = 'aktif';
let metodeFilter = 'semua';
let soundOn = false;
let knownOrderIds = new Set();
let knownCallIds = new Set();
let menuStatus = {};
let viewKelola = false;

function rupiah(n) { return 'Rp ' + n.toLocaleString('id-ID'); }


function checkPinSession() {
  const saved = localStorage.getItem('kasir_pin_ok');
  if (saved === 'yes') {
    showDashboard();
  } else {
    document.getElementById('pinScreen').classList.add('show');
    document.getElementById('dashboard').classList.remove('show');
    setTimeout(() => document.getElementById('pinInput').focus(), 200);
  }
}

function submitPin() {
  const input = document.getElementById('pinInput').value.trim();
  const errEl = document.getElementById('pinError');
  if (input === KASIR_PIN) {
    localStorage.setItem('kasir_pin_ok', 'yes');
    errEl.textContent = '';
    document.getElementById('pinInput').value = '';
    showDashboard();
  } else {
    errEl.textContent = '❌ PIN salah. Coba lagi.';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

document.getElementById('pinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPin();
});

function showDashboard() {
  document.getElementById('pinScreen').classList.remove('show');
  document.getElementById('dashboard').classList.add('show');
  loadOrders();
  loadCalls();
  loadMenuStatus();
  subscribeRealtime();
  setInterval(loadOrders, 15000);
  setInterval(loadCalls, 3000);
}

function logout() {
  if (!confirm('Logout dari dashboard kasir?')) return;
  localStorage.removeItem('kasir_pin_ok');
  location.reload();
}


let audioCtx = null;

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  if (soundOn) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    btn.classList.add('on');
    btn.textContent = '🔔 Suara ON';
    playBeep(880, 1200);
  } else {
    btn.classList.remove('on');
    btn.textContent = '🔕 Suara OFF';
  }
}

function playBeep(freq1 = 880, freq2 = 1200) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.value = freq1;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  setTimeout(() => {
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.type = 'sine'; osc2.frequency.value = freq2;
    gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc2.start(); osc2.stop(audioCtx.currentTime + 0.3);
  }, 200);
}


async function loadOrders() {
  const { data, error } = await db
    .from('orders').select('*')
    .order('created_at', { ascending: false }).limit(100);
  if (error) { console.error('Error load orders:', error); return; }
  orders = data || [];
  knownOrderIds = new Set(orders.map(o => o.id));
  renderOrders();
}

async function loadCalls() {
  const { data, error } = await db
    .from('calls').select('*')
    .eq('status', 'pending').order('created_at', { ascending: true });
  if (error) { console.error('Error load calls:', error); return; }
  calls = data || [];
  knownCallIds = new Set(calls.map(c => c.id));
  renderCalls();
}

async function loadMenuStatus() {
  const { data, error } = await db.from('menu_status').select('*');
  if (error) { console.error('Error load menu status:', error); return; }
  menuStatus = {};
  (data || []).forEach(row => {
    menuStatus[row.menu_id] = row.tersedia;
  });
  renderKelolaMenu();
}


function toggleKelola() {
  viewKelola = !viewKelola;
  const btn = document.getElementById('kelolaBtn');
  const viewDash = document.getElementById('viewDashboard');
  const viewKel = document.getElementById('viewKelola');
  
  if (viewKelola) {
    btn.classList.add('active');
    btn.textContent = '← Balik ke Pesanan';
    viewDash.style.display = 'none';
    viewKel.classList.add('show');
    renderKelolaMenu();
  } else {
    btn.classList.remove('active');
    btn.textContent = '⚙️ Kelola Menu';
    viewDash.style.display = 'block';
    viewKel.classList.remove('show');
  }
}

function renderKelolaMenu() {
  const search = (document.getElementById('kelolaSearch').value || '').toLowerCase();
  const list = document.getElementById('kelolaList');
  
  const filtered = MENU.filter(m => 
    m.nama.toLowerCase().includes(search) || 
    m.kat.toLowerCase().includes(search)
  );
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Menu tidak ditemukan</div>';
    return;
  }
  
  list.innerHTML = filtered.map(m => {
    const tersedia = menuStatus[m.id] !== false;
    return `
      <div class="kelola-item ${tersedia ? '' : 'habis'}">
        <div class="emoji-box">${m.emoji || '🍽️'}</div>
        <div class="info">
          <h4>${m.nama}</h4>
          <div class="kat">${m.kat}</div>
          <div class="harga">${rupiah(m.harga)}</div>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-${m.id}" 
                 ${tersedia ? 'checked' : ''} 
                 onchange="toggleMenuStatus(${m.id}, this)">
          <label for="toggle-${m.id}" class="${tersedia ? '' : 'off'}"></label>
        </div>
      </div>
    `;
  }).join('');
}

async function toggleMenuStatus(menuId, checkbox) {
  const tersediaBaru = checkbox.checked;
  const label = document.querySelector(`label[for="toggle-${menuId}"]`);
  

  menuStatus[menuId] = tersediaBaru;
  label.classList.add('busy');
  

  const item = checkbox.closest('.kelola-item');
  if (item) item.classList.toggle('habis', !tersediaBaru);
  
  const { error } = await db
    .from('menu_status')
    .update({ 
      tersedia: tersediaBaru,
      updated_at: new Date().toISOString()
    })
    .eq('menu_id', menuId);
  
  label.classList.remove('busy');
  
  if (error) {
    
    menuStatus[menuId] = !tersediaBaru;
    checkbox.checked = !tersediaBaru;
    if (item) item.classList.toggle('habis', tersediaBaru);
    alert('Gagal update: ' + error.message);
  }
}


function setFilter(mode) {
  filterMode = mode;
  document.getElementById('tab-aktif').classList.toggle('active', mode === 'aktif');
  document.getElementById('tab-semua').classList.toggle('active', mode === 'semua');
  renderOrders();
}

function setMetode(m) {
  metodeFilter = m;
  document.getElementById('metode-semua').classList.toggle('active', m === 'semua');
  document.getElementById('metode-qris').classList.toggle('active', m === 'qris');
  document.getElementById('metode-cash').classList.toggle('active', m === 'cash');
  renderOrders();
}


function getDurasiSewa(order) {
  const sewaItems = (order.items || []).filter(it => 
    it.sewa === true || it.kat === 'Sewa Meja'
  );
  if (sewaItems.length === 0) return null;
  let totalMenit = 0;
  sewaItems.forEach(it => {
    const match = it.nama.match(/(\d+)\s*Jam/i);
    if (match) totalMenit += parseInt(match[1]) * 60 * (it.qty || 1);
  });
  if (totalMenit === 0) return null;
  return totalMenit;
}

function renderTimerBox(order) {
  const durasiMenit = getDurasiSewa(order);
  if (!durasiMenit) return '';
  const startTime = new Date(order.paid_at || order.created_at).getTime();
  const endTime = startTime + durasiMenit * 60 * 1000;
  const timerId = `timer-${order.id}`;
  if (order.status === 'cancelled') return '';
  return `
    <div class="timer-box" id="${timerId}" data-end="${endTime}">
      <div>
        <div class="label">⏱️ Sewa Meja ${durasiMenit/60} Jam</div>
        <div style="font-size:10px; opacity:.8;">
          Mulai: ${new Date(startTime).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}
        </div>
      </div>
      <div class="countdown" id="${timerId}-val">--:--:--</div>
    </div>
  `;
}

function updateAllTimers() {
  const now = Date.now();
  document.querySelectorAll('.timer-box').forEach(box => {
    const endTime = parseInt(box.dataset.end);
    const sisaMs = endTime - now;
    const timerId = box.id;
    const valEl = document.getElementById(timerId + '-val');
    if (!valEl) return;
    if (sisaMs <= 0) {
      valEl.textContent = 'HABIS';
      box.classList.remove('warning', 'danger');
      box.classList.add('expired');
    } else {
      const sisaDetik = Math.floor(sisaMs / 1000);
      const jam = Math.floor(sisaDetik / 3600);
      const menit = Math.floor((sisaDetik % 3600) / 60);
      const detik = sisaDetik % 60;
      valEl.textContent = String(jam).padStart(2,'0') + ':' + String(menit).padStart(2,'0') + ':' + String(detik).padStart(2,'0');
      box.classList.remove('warning', 'danger', 'expired');
      if (sisaDetik <= 300) box.classList.add('danger');
      else if (sisaDetik <= 600) box.classList.add('warning');
    }
  });
}
setInterval(updateAllTimers, 1000);


function renderOrders() {
  const list = document.getElementById('ordersList');
  let filtered = orders;
  if (filterMode === 'aktif') filtered = filtered.filter(o => o.status === 'pending');
  if (metodeFilter !== 'semua') filtered = filtered.filter(o => o.payment_method === metodeFilter);
  
  const pendingCount = orders.filter(o => o.status === 'pending').length;
  const paidCount = orders.filter(o => o.status === 'paid').length;
  const revenue = orders
    .filter(o => o.status === 'paid')
    .filter(o => {
      const today = new Date().toDateString();
      return new Date(o.paid_at || o.created_at).toDateString() === today;
    })
    .reduce((sum, o) => sum + o.total, 0);
  
  document.getElementById('statPending').textContent = pendingCount;
  document.getElementById('statPaid').textContent = paidCount;
  document.getElementById('statRevenue').textContent = rupiah(revenue);
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">' + (filterMode === 'aktif' ? 'Tidak ada pesanan aktif 🎉' : 'Belum ada pesanan') + '</div>';
    return;
  }
  
  list.innerHTML = filtered.map(o => renderOrderCard(o)).join('');
  updateAllTimers();
}

function renderOrderCard(o) {
  const isPaid = o.status === 'paid';
  const isCancelled = o.status === 'cancelled';
  const durasiSewa = getDurasiSewa(o);
  const isSewa = durasiSewa !== null;
  
  const items = (o.items || []).map(it => `
    <div class="item">
      <span><span class="qty">${it.qty}x</span> ${it.nama}</span>
      <span>${rupiah(it.harga * it.qty)}</span>
    </div>
  `).join('');
  
  const waktu = new Date(o.created_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  const catatanHtml = o.catatan ? `<div class="order-catatan">📝 ${o.catatan}</div>` : '';
  const isCash = o.payment_method === 'cash';
  const methodBadge = isCash 
    ? '<span class="method-badge cash">💵 CASH</span>'
    : '<span class="method-badge qris">📱 QRIS</span>';
  const namaHtml = o.nama_customer ? `<span class="nama-customer">👤 ${o.nama_customer}</span>` : '';
  const timerHtml = (isSewa && !isCancelled) ? renderTimerBox(o) : '';
  
  let footerHtml;
  if (isCancelled) {
    footerHtml = `<div class="status-cancelled">❌ DIBATALKAN</div>`;
  } else if (isPaid) {
    footerHtml = `<div class="status-paid">✓ LUNAS — ${o.paid_at ? new Date(o.paid_at).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}) : ''}</div>`;
  } else {
    footerHtml = `
      <div class="actions">
        <button class="btn-lunas" onclick="tandaiLunas('${o.id}')">✓ Lunas</button>
        <button class="btn-batal" onclick="batalkanPesanan('${o.id}')">❌ Batal</button>
      </div>
    `;
  }
  
  const cardClass = `${isPaid ? 'paid' : ''} ${isCancelled ? 'cancelled' : ''} ${isSewa ? 'sewa' : ''}`;
  
  return `
    <div class="order-card ${cardClass}">
      <div class="order-header">
        <div style="display:flex; flex-direction:column; gap:4px; min-width:0; flex:1;">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <div class="meja-badge">MEJA ${o.meja}${methodBadge}</div>
            ${namaHtml}
          </div>
        </div>
        <div class="time">🕐 ${waktu}</div>
      </div>
      <div class="order-items">${items}</div>
      ${timerHtml}
      ${catatanHtml}
      <div class="order-footer">
        <div class="total">${rupiah(o.total)}</div>
        ${footerHtml}
      </div>
    </div>
  `;
}

function renderCalls() {
  const section = document.getElementById('callsSection');
  const list = document.getElementById('callsList');
  if (calls.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('callsCount').textContent = calls.length;
  
  const labelMap = {
    asbak: '🚬 Minta Asbak',
    tisu: '🧻 Minta Tisu',
    sendok: '🥄 Minta Sendok',
    kasir: '💳 Panggil Kasir'
  };
  
  list.innerHTML = calls.map(c => {
    const waktu = new Date(c.created_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    return `
      <div class="call-item">
        <div class="info">
          <div><span class="meja-call">Meja ${c.meja}</span> — ${labelMap[c.jenis] || c.jenis}</div>
          <div class="time-call">🕐 ${waktu}</div>
        </div>
        <button class="btn-selesai" onclick="selesaikanCall('${c.id}')">✓ Selesai</button>
      </div>
    `;
  }).join('');
}


async function tandaiLunas(orderId) {
  const { error } = await db
    .from('orders')
    .update({ status: 'paid', paid_at: new Date().toISOString() })
    .eq('id', orderId);
  if (error) { alert('Gagal update: ' + error.message); return; }
}

async function batalkanPesanan(orderId) {
  const order = orders.find(o => o.id === orderId);
  const meja = order ? order.meja : '?';
  const nama = order && order.nama_customer ? ` (${order.nama_customer})` : '';
  const total = order ? rupiah(order.total) : '';
  
  const yakin = confirm(
    `⚠️ YAKIN BATALKAN PESANAN?\n\n` +
    `Meja: ${meja}${nama}\n` +
    `Total: ${total}\n\n` +
    `Pesanan akan hilang dari daftar aktif.\n` +
    `Tindakan ini tidak bisa dibatalkan!`
  );
  if (!yakin) return;
  
  const { error } = await db
    .from('orders').update({ status: 'cancelled' }).eq('id', orderId);
  if (error) { alert('Gagal batalkan: ' + error.message); return; }
}

async function selesaikanCall(callId) {
  calls = calls.filter(c => c.id !== callId);
  renderCalls();
  db.from('calls')
    .update({ status: 'selesai', selesai_at: new Date().toISOString() })
    .eq('id', callId)
    .then(({ error }) => { if (error) loadCalls(); });
}


function subscribeRealtime() {
  db.channel('orders-ch')
    .on('postgres_changes', 
      { event: 'INSERT', schema: 'public', table: 'orders' },
      (payload) => {
        if (knownOrderIds.has(payload.new.id)) return;
        orders.unshift(payload.new);
        knownOrderIds.add(payload.new.id);
        playBeep(880, 1200);
        renderOrders();
        flashTitle('🔔 PESANAN BARU!');
      }
    )
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'orders' },
      (payload) => {
        const idx = orders.findIndex(o => o.id === payload.new.id);
        if (idx !== -1) orders[idx] = payload.new;
        else orders.unshift(payload.new);
        renderOrders();
      }
    )
    .subscribe();
  
  db.channel('calls-ch')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'calls' },
      (payload) => {
        if (knownCallIds.has(payload.new.id)) return;
        calls.push(payload.new);
        knownCallIds.add(payload.new.id);
        playBeep(660, 990);
        renderCalls();
        flashTitle('🔔 PANGGILAN!');
      }
    )
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'calls' },
      (payload) => {
        if (payload.new.status === 'selesai') {
          calls = calls.filter(c => c.id !== payload.new.id);
        } else {
          const idx = calls.findIndex(c => c.id === payload.new.id);
          if (idx !== -1) calls[idx] = payload.new;
        }
        renderCalls();
      }
    )
    .subscribe();
  
  db.channel('menu-status-ch')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'menu_status' },
      (payload) => {
        menuStatus[payload.new.menu_id] = payload.new.tersedia;
        renderKelolaMenu();
      }
    )
    .subscribe();
}

let flashInterval = null;
function flashTitle(msg) {
  if (flashInterval) return;
  let on = false;
  const original = document.title;
  flashInterval = setInterval(() => {
    document.title = on ? msg : original;
    on = !on;
  }, 800);
  setTimeout(() => {
    clearInterval(flashInterval);
    flashInterval = null;
    document.title = original;
  }, 10000);
}


checkPinSession();
